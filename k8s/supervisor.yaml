apiVersion: v1
kind: Service
metadata:
  name: supervisor
spec:
  selector:
    app: supervisor
  ports:
    - name: http
      port: 8080
---
# Un seul réplica, volontairement : l'état des fourchettes est en mémoire. C'est justement la
# limite d'un superviseur central (point unique de défaillance), que le protocole par jetons lève.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervisor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: supervisor
  template:
    metadata:
      labels:
        app: supervisor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      enableServiceLinks: false
      containers:
        - name: supervisor
          image: ghcr.io/bejisouheil/dining-philosophers-microservices/supervisor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dining-config
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
