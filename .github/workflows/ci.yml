name: CI/CD

# Chaîne complète à chaque push et à chaque pull request :
#   1. build   : compilation et tous les tests (unitaires, intégration, bout en bout)
#   2. images  : construction des images Docker ; publication sur GHCR depuis master
#   3. deploy  : déploiement sur un cluster Kubernetes jetable (kind) et test de fumée,
#                avec suppression d'un pod pour vérifier la reprise automatique

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Les tests Testcontainers (ZooKeeper, Kafka) utilisent le Docker du runner.
      - name: Compiler et lancer tous les tests
        run: ./mvnw -B -ntp verify

      - name: Conserver les rapports de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  images:
    name: Image ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [philosopher-service, monitor-service, supervisor-service]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sur une pull request l'image est seulement construite ; sur master elle est publiée.
      - name: Construire l'image (publiée depuis master uniquement)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max

  deploy:
    name: Déploiement Kubernetes (kind) et test de fumée
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Créer un cluster Kubernetes jetable
        uses: helm/kind-action@v1
        with:
          cluster_name: dining

      - name: Construire les images et les charger dans le cluster
        run: |
          for service in philosopher-service monitor-service supervisor-service; do
            docker build --build-arg SERVICE=$service -t $REGISTRY/$service:latest .
            kind load docker-image $REGISTRY/$service:latest --name dining
          done

      - name: Déployer
        run: |
          kubectl apply -k k8s
          for workload in deployment/zookeeper deployment/kafka deployment/monitor deployment/supervisor; do
            kubectl -n dining rollout status $workload --timeout=300s
          done
          kubectl -n dining rollout status statefulset/philosopher --timeout=480s

      - name: Test de fumée, les philosophes mangent sans violation
        run: ops/smoke-test.sh

      - name: Résilience, un pod supprimé est recréé et le système continue
        run: |
          kubectl -n dining delete pod philosopher-2
          kubectl -n dining rollout status statefulset/philosopher --timeout=300s
          ops/smoke-test.sh

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          kubectl -n dining get pods -o wide
          kubectl -n dining describe pods | tail -n 80
          kubectl -n dining logs statefulset/philosopher --tail=60 || true
          kubectl -n dining logs deployment/monitor --tail=60 || true
          kubectl -n dining logs deployment/kafka --tail=40 || true
